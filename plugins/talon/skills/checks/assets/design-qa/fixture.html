<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout verification fixture</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; }
  #frame { box-sizing: border-box; width: 360px; height: 240px; padding: 24px; background: #e8f1ed; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  button { display: block; box-sizing: border-box; width: 136px; height: 44px; margin-left: 16px;
    background: #254d40; color: white; border: 0; border-radius: 8px; font: inherit; }
  .aligned button { margin-left: 0; }
</style>
<main id="frame">
  <h1>Weekly report</h1>
  <button>Open report</button>
</main>
<script>
  if (new URLSearchParams(location.search).has('aligned')) {
    document.querySelector('#frame').classList.add('aligned');
  }
</script>
